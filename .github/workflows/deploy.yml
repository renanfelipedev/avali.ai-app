name: Deploy Laravel em Produção

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Executar deploy e migrations via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /srv/avaliai

            git config --global --add safe.directory /srv/avaliai || true

            php artisan down --retry=60 || true

            git fetch origin main
            git checkout main
            git reset --hard origin/main

            composer install --no-dev --no-interaction --prefer-dist
            php artisan migrate --force
            php artisan db:seed --force

            php artisan optimize:clear

            php artisan queue:restart
            php artisan up
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH="$PATH:/usr/local/bin:/usr/bin:/bin:$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node 2>/dev/null | tail -n 1)/bin"

            if command -v npm >/dev/null 2>&1; then
              npm run build
            fi